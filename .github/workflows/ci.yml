name: CI

on:
  pull_request:
  push:
    # C22 pivot (2026-09-02): trigger on every branch push so the
    # autonomous driver's checkpoint commits get validated by CI
    # instead of relying on the workstation's fragile local
    # tsc/lint/vitest under memory pressure.
    branches:
      - main
      - "claude/**"
      - "codex/**"
      - "integration/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_only
      EXTERNAL_ACTIONS_ENABLED: "false"
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
